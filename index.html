<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102118">
<title>Bleau Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#0d1712;--panel:#17261f;--panel2:#22382d;--text:#f5f7f6;--muted:#b7c4bd;--green:#58d68d;--red:#ff6f67;--amber:#f4c65d;--blue:#65b9ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{z-index:1000;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:rgba(13,23,18,.96);backdrop-filter:blur(10px);box-shadow:0 5px 18px #0005}.brand{flex:1;min-width:0}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{border:0;border-radius:13px;padding:10px 11px;font-weight:800;background:var(--panel2);color:var(--text);cursor:pointer}#locateBtn{background:#86d8a7;color:#0c1a12}#map{width:100%;height:100%}
.searchWrap{position:absolute;left:10px;top:69px;z-index:960;width:min(330px,calc(100vw - 20px))}.searchBox{display:flex;align-items:center;gap:7px;background:rgba(23,38,31,.97);padding:7px 9px;border-radius:14px;box-shadow:0 4px 14px #0005}.searchBox span{font-size:16px}.searchBox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:14px}.searchBox input::placeholder{color:#b7c4bd}.searchClear{display:none;padding:2px 6px;background:transparent;font-size:18px}.searchResults{display:none;margin-top:6px;background:rgba(23,38,31,.98);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0008;max-height:42vh;overflow-y:auto}.searchResults.show{display:block}.searchItem{padding:10px 12px;border-bottom:1px solid #ffffff12;cursor:pointer}.searchItem:last-child{border-bottom:0}.searchName{font-size:13px;font-weight:800}.searchMeta{font-size:11px;color:var(--muted);margin-top:2px}.searchEmpty{padding:11px 12px;color:var(--muted);font-size:12px}
.filters{position:absolute;left:10px;top:116px;z-index:900;display:flex;gap:6px;flex-wrap:wrap;max-width:74%}.filters button{font-size:11px;padding:8px 9px;background:rgba(23,38,31,.94);box-shadow:0 4px 13px #0004}.filterBtn.active{outline:2px solid #fff5}.legend{position:absolute;right:10px;top:116px;z-index:900;background:rgba(23,38,31,.94);padding:9px 10px;border-radius:14px;font-size:11px;box-shadow:0 5px 18px #0005}.row{display:flex;align-items:center;gap:7px;margin:4px 0}.dot{width:10px;height:10px;border-radius:50%}.open{background:var(--green)}.closed{background:var(--red)}.partial{background:var(--amber)}.parking{background:var(--blue)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}.leaflet-popup-content{min-width:240px;margin:13px}.title{font-size:16px;font-weight:900}.sub{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.4}.badge{display:inline-block;margin:8px 0;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge-open{background:#173d28;color:#80e6a8}.badge-closed{background:#4a211f;color:#ff938c}.badge-partial{background:#493b18;color:#ffd875}.maps,.sectorLink{display:block;text-align:center;text-decoration:none;padding:10px;border-radius:11px;font-weight:900;margin-top:8px}.maps{background:#82d5a4;color:#0c1a12}.sectorLink{background:#2b4035;color:#f5f7f6}.source{display:block;text-align:center;text-decoration:none;color:#c6d2cc;font-size:11px;margin-top:9px}.parkingFor{margin-top:7px;padding-top:7px;border-top:1px solid #ffffff12;color:#d6dfda}.sectorParking{margin-top:8px;padding:8px 9px;border:1px solid #65b9ff55;border-radius:10px;background:#163044;color:#d9ecff}.sectorParking b{color:#fff}
.noticeWrap{position:absolute;left:10px;right:10px;bottom:16px;z-index:950;display:flex;justify-content:center;pointer-events:none}.notice{display:none;pointer-events:auto;max-width:560px;background:rgba(23,38,31,.97);border:1px solid #ffffff15;border-radius:17px;padding:13px;box-shadow:0 10px 28px #0007}.notice.show{display:block}.notice h2{font-size:14px;margin:0 0 5px}.notice p{font-size:12px;line-height:1.4;color:var(--muted);margin:0 0 9px}.actions{display:flex;gap:7px}.actions button{flex:1}.primary{background:#84d6a5;color:#0c1a12}.close{background:#2b4035}
@media(max-width:560px){header .label{display:none}.filters{max-width:70%}.legend{font-size:10px;padding:8px}.searchWrap{width:calc(100vw - 20px)}}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><h1>Bleau Map</h1><p id="subtitle">90 Sektoren · 25 Parkplätze · Stand 3.–4. Sept. 2026</p></div><button id="locateBtn">◎ <span class="label">Mein Standort</span></button></header><div id="map"></div></div>
<div class="searchWrap"><div class="searchBox"><span>⌕</span><input id="sectorSearch" type="search" placeholder="Sektor suchen …" autocomplete="off" spellcheck="false"><button id="searchClear" class="searchClear" aria-label="Suche löschen">×</button></div><div id="searchResults" class="searchResults"></div></div>
<div class="filters"><button class="filterBtn active" data-filter="all">Alle</button><button class="filterBtn" data-filter="open">Offen</button><button class="filterBtn" data-filter="closed">Gesperrt</button><button class="filterBtn" data-filter="partial">Teilweise</button><button class="filterBtn" data-filter="parking">Parkplätze</button></div>
<div class="legend"><div class="row"><span class="dot open"></span>offen</div><div class="row"><span class="dot partial"></span>teilweise</div><div class="row"><span class="dot closed"></span>gesperrt</div><div class="row"><span class="dot parking"></span>Parkplatz</div></div>
<div class="noticeWrap"><div class="notice" id="notice"><h2 id="noticeTitle"></h2><p id="noticeText"></p><div class="actions" id="noticeActions"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="sectors.js"></script>
<script>
const STATUS_SOURCE='https://www.topo-bleau.fr/Home';
const BOOLDER_BASE='https://www.boolder.com/en/fontainebleau/';
const sectors=window.BLEAU_SECTORS||[];
const map=L.map('map',{zoomControl:false}).setView([48.405,2.615],11);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const parkings=[
{name:'Parking Bas Cuvier',lat:48.446425,lng:2.637633,for:'Cuvier, Cuvier Ouest, Cuvier Nord, Cuvier Rempart'},
{name:'Parking Franchard Isatis / Plaine de Macherin',lat:48.411158,lng:2.598489,for:'Franchard Isatis, Hautes Plaines, Sablons, Meyer'},
{name:'Parking Franchard Cuisinière',lat:48.417072,lng:2.607630,for:'Franchard Cuisinière und Crêtes Sud'},
{name:'Parking Franchard Ermitage / Raymond',lat:48.409035,lng:2.634742,for:'Franchard Raymond und Umgebung'},
{name:'Parking Rocher Canon',lat:48.462885,lng:2.666102,for:'Rocher Canon und Rocher Canon Ouest'},
{name:'Parking Apremont Hauptzugang',lat:48.440565,lng:2.624305,for:'Apremont, Bizons, Bizons Enfants, Butte aux Dames, Ouest, Envers'},
{name:'Parking Apremont Désert / Clair Bois',lat:48.445376,lng:2.637148,for:'Apremont Désert und östliche Apremont-Bereiche'},
{name:'Parking Apremont Chaos',lat:48.430234,lng:2.638643,for:'Apremont Portes du Désert, Solitude, Sully und südliche Bereiche'},
{name:'Parking Rocher Saint-Germain',lat:48.440750,lng:2.689775,for:'Rocher Saint-Germain Est'},
{name:'Parking Roche d’Hercule',lat:48.420907,lng:2.698678,for:'Roche d’Hercule und Mont Ussy Est'},
{name:'Parking Mont Ussy',lat:48.418019,lng:2.694808,for:'Mont Ussy und Mont Ussy Est'},
{name:'Parking Le Calvaire',lat:48.425339,lng:2.709494,for:'Le Calvaire'},
{name:'Parking Mont Aigu',lat:48.404927,lng:2.677557,for:'Mont Aigu',warning:'Mont Aigu ist derzeit gesperrt – Parkplatz nur als Orientierung angezeigt.'},
{name:'Parking Rocher d’Avon',lat:48.396013,lng:2.722396,for:'Rocher d’Avon und Rocher d’Avon Est'},
{name:'Parking Restant du Long Rocher',lat:48.353836,lng:2.727659,for:'Restant du Long Rocher und Süd'},
{name:'Parking Rocher de Bouligny',lat:48.384811,lng:2.688181,for:'Rocher de Bouligny'},
{name:'Parking de l’Éléphant',lat:48.29301,lng:2.59822,for:'Éléphant, Dame Jouanne und Larchant-Umgebung'},
{name:'Parking Noisy-sur-École / Roche aux Sabots',lat:48.373140,lng:2.510375,for:'Roche aux Sabots, Cul de Chien, 91.1, Roche aux Oiseaux, La Ségognole',warning:'Mehrere zugehörige Trois-Pignons-Sektoren sind weiterhin gesperrt oder nur eingeschränkt zugänglich.'},
{name:'Parking Croix Saint-Jérôme / 95.2',lat:48.387789,lng:2.519429,for:'95.2 und westliche Trois-Pignons-Bereiche',warning:'95.2 ist derzeit gesperrt.'},
{name:'Parking Gorge aux Châts',lat:48.399608,lng:2.516904,for:'Gorge aux Châts'},
{name:'Parking Feuillardière / Télégraphe',lat:48.401329,lng:2.546984,for:'Rocher du Télégraphe und Feuillardière'},
{name:'Parking Canche aux Merciers',lat:48.390452,lng:2.552572,for:'Canche aux Merciers'},
{name:'Parking Corne-Biche',lat:48.399383,lng:2.566086,for:'Corne-Biche'},
{name:'Parking Drei Zinnen',lat:48.393259,lng:2.555213,for:'Drei Zinnen'},
{name:'Parking Rocher de la Reine / Bois Rond',lat:48.390951,lng:2.557455,for:'Rocher de la Reine, Bois Rond und Bois Rond Auberge'}
];
const layers={sector:[],parking:[]},markerByName=new Map();
function statusColor(s){return s==='open'?'#58d68d':s==='closed'?'#ff6f67':'#f4c65d'}
function badge(s){const txt=s==='open'?'OFFEN':s==='closed'?'GESPERRT':'TEILWEISE';return `<span class="badge badge-${s}">${txt}</span>`}
function statusNote(s){if(s.status==='partial')return 'Nur teilweise bzw. mit Einschränkungen zugänglich. Offizielle Karte und Beschilderung vor Ort prüfen.';if(s.status==='closed')return s.group==='Trois Pignons'?'Dieser Sektor liegt in einem derzeit gesperrten Teil von Trois Pignons.':'Dieser Sektor ist derzeit als gesperrt geführt.';if(s.group==='Trois Pignons')return 'Dieser Sektor gehört zu den aktuell zugänglichen Ausnahmen in Trois Pignons.';return 'Dieser Sektor ist aktuell als offen geführt.'}
function km(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearestParking(s){let best=null,bestD=Infinity;for(const p of parkings){const d=km({lat:s.lat,lng:s.lng},p);if(d<bestD){bestD=d;best=p}}return bestD<=3?best:null}
sectors.forEach(s=>{const m=L.circleMarker([s.lat,s.lng],{radius:8,color:'#fff',weight:2,fillColor:statusColor(s.status),fillOpacity:.95}).addTo(map);m._kind='sector';m._status=s.status;const p=nearestParking(s);let parkingHtml='<div class="sectorParking"><b>Parkplatz:</b><br>Für diesen Sektor ist noch kein verifizierter Parkplatz eingetragen.</div>';if(p){const g=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;parkingHtml=`<div class="sectorParking"><b>Nächstgelegener eingetragener Parkplatz:</b><br>${p.name}${p.warning?'<br>⚠ '+p.warning:''}</div><a class="maps" href="${g}" target="_blank" rel="noopener">Zum Parkplatz navigieren</a>`}m.bindPopup(`<div class="title">${s.name}</div>${badge(s.status)}<div class="sub"><b>${s.group}</b><br>${statusNote(s)}<br><br>Im Zweifel gelten immer die aktuelle offizielle Absperrung und Beschilderung vor Ort.</div>${parkingHtml}<a class="sectorLink" href="${BOOLDER_BASE+s.slug}" target="_blank" rel="noopener">Sektorinfo auf Boolder öffnen</a><a class="source" href="${STATUS_SOURCE}" target="_blank" rel="noopener">Aktuelle Zugangsinfo prüfen</a>`);layers.sector.push(m);markerByName.set(s.name,m)});
const pIcon=L.divIcon({className:'',html:'<div style="width:29px;height:29px;border-radius:50%;background:#2787d8;border:3px solid #fff;box-shadow:0 2px 8px #0008;display:grid;place-items:center;color:#fff;font:bold 16px system-ui">P</div>',iconSize:[29,29],iconAnchor:[14,14]});
parkings.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:pIcon}).addTo(map);m._kind='parking';const g=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;m.bindPopup(`<div class="title">${p.name}</div><div class="sub">${p.warning||'Navigation direkt zu diesem Parkplatz.'}<div class="parkingFor"><b>Zugang für:</b><br>${p.for}</div></div><a class="maps" href="${g}" target="_blank" rel="noopener">In Google Maps navigieren</a>`);layers.parking.push(m)});
const activeFilters=new Set(['all']);
function applyFilters(){const all=activeFilters.has('all');[...layers.sector,...layers.parking].forEach(l=>map.removeLayer(l));if(all){[...layers.sector,...layers.parking].forEach(l=>l.addTo(map));return}layers.sector.forEach(l=>{if(activeFilters.has(l._status))l.addTo(map)});if(activeFilters.has('parking'))layers.parking.forEach(l=>l.addTo(map))}
function syncFilterButtons(){document.querySelectorAll('.filterBtn').forEach(b=>b.classList.toggle('active',activeFilters.has(b.dataset.filter)))}
function setFilter(f){if(f==='all'){activeFilters.clear();activeFilters.add('all')}else{activeFilters.delete('all');if(activeFilters.has(f))activeFilters.delete(f);else activeFilters.add(f);if(activeFilters.size===0)activeFilters.add('all')}syncFilterButtons();applyFilters()}
document.querySelectorAll('.filterBtn').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
document.getElementById('subtitle').textContent=`${sectors.length} Sektoren · ${parkings.length} Parkplätze · Stand 3.–4. Sept. 2026`;
const search=document.getElementById('sectorSearch'),results=document.getElementById('searchResults'),clear=document.getElementById('searchClear');
function norm(x){return x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function closeSearch(){results.classList.remove('show')}
function renderSearch(){const q=norm(search.value.trim());clear.style.display=q?'block':'none';if(!q){closeSearch();results.innerHTML='';return}const matches=sectors.filter(s=>norm(s.name+' '+s.group).includes(q)).slice(0,12);results.innerHTML=matches.length?matches.map((s,i)=>`<div class="searchItem" data-i="${i}"><div class="searchName">${s.name}</div><div class="searchMeta">${s.group} · ${s.status==='open'?'offen':s.status==='closed'?'gesperrt':'teilweise'}</div></div>`).join(''):'<div class="searchEmpty">Kein Sektor gefunden.</div>';results.classList.add('show');results.querySelectorAll('.searchItem').forEach((el,i)=>el.onclick=()=>selectSector(matches[i]))}
function selectSector(s){activeFilters.clear();activeFilters.add('all');syncFilterButtons();applyFilters();const m=markerByName.get(s.name);map.setView([s.lat,s.lng],15);setTimeout(()=>m&&m.openPopup(),180);search.value=s.name;clear.style.display='block';closeSearch();search.blur()}
search.addEventListener('input',renderSearch);search.addEventListener('focus',renderSearch);clear.onclick=()=>{search.value='';clear.style.display='none';closeSearch();search.focus()};document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))closeSearch()});
let userMarker,userCircle;const notice=document.getElementById('notice'),noticeTitle=document.getElementById('noticeTitle'),noticeText=document.getElementById('noticeText'),noticeActions=document.getElementById('noticeActions');function hideNotice(){notice.classList.remove('show')}function showNotice(t,x,buttons=[]){noticeTitle.textContent=t;noticeText.innerHTML=x;noticeActions.innerHTML='';buttons.forEach(b=>{const el=document.createElement('button');el.textContent=b.text;el.className=b.cls||'close';el.onclick=b.fn;noticeActions.appendChild(el)});notice.classList.add('show')}
function drawLocation(pos){const {latitude,longitude,accuracy}=pos.coords;if(userMarker)map.removeLayer(userMarker);if(userCircle)map.removeLayer(userCircle);userCircle=L.circle([latitude,longitude],{radius:accuracy,color:'#72dc9c',fillColor:'#72dc9c',fillOpacity:.12,weight:1}).addTo(map);userMarker=L.circleMarker([latitude,longitude],{radius:9,color:'#fff',weight:3,fillColor:'#34c970',fillOpacity:1}).addTo(map).bindPopup('<div class="title">Du bist hier</div>');map.setView([latitude,longitude],15);hideNotice()}
function locationError(e){let x='Standort konnte nicht bestimmt werden.';if(e.code===1)x='<b>Standort ist für diese Seite blockiert.</b><br>In Chrome: Symbol links neben der Webadresse → Berechtigungen → Standort → Zulassen. Danach erneut auf „Mein Standort“ tippen.';if(e.code===2)x='GPS/Standort am Handy einschalten und erneut versuchen.';if(e.code===3)x='Die Standortbestimmung hat zu lange gedauert.';showNotice('Standort nicht verfügbar',x,[{text:'Erneut versuchen',cls:'primary',fn:requestLocation},{text:'Schliessen',fn:hideNotice}])}
function requestLocation(){if(!navigator.geolocation){showNotice('Nicht unterstützt','Dieser Browser unterstützt Standort nicht.',[{text:'Schliessen',fn:hideNotice}]);return}navigator.geolocation.getCurrentPosition(drawLocation,locationError,{enableHighAccuracy:true,timeout:12000,maximumAge:10000})}
document.getElementById('locateBtn').onclick=requestLocation;
</script></body></html>
