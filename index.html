<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13261d" />
  <title>Bleau Map</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--bg:#0f1914;--panel:#17261f;--panel2:#20352a;--text:#f5f7f6;--muted:#b8c4be;--accent:#80cfa0;--danger:#ff8278;--warn:#f4c96b;--ok:#79d69b}
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr}
    header{position:relative;z-index:1000;padding:10px 12px;background:linear-gradient(180deg,rgba(15,25,20,.98),rgba(15,25,20,.92));backdrop-filter:blur(10px);display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
    .brand{min-width:0;flex:1}.brand h1{font-size:18px;line-height:1.1;margin:0}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button,.chip{border:0;border-radius:14px;background:var(--panel2);color:var(--text);padding:10px 12px;font-weight:700;font-size:13px}.locate{background:var(--accent);color:#0c1b12;display:flex;align-items:center;gap:7px;box-shadow:0 6px 18px rgba(128,207,160,.2)}
    #map{height:100%;width:100%}.leaflet-control-zoom a{background:#17261f!important;color:#fff!important;border-color:#2e483a!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#17261f;color:#fff}.leaflet-popup-content{margin:14px 15px;min-width:220px}
    .popup-title{font-size:16px;font-weight:800;margin-bottom:5px}.popup-sub{font-size:12px;color:var(--muted);margin-bottom:10px}.maps-link{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#0c1b12;padding:10px 12px;border-radius:12px;font-weight:800}
    .floating{position:absolute;z-index:900;left:12px;right:12px;bottom:18px;display:flex;justify-content:center;pointer-events:none}.notice{pointer-events:auto;display:none;max-width:560px;background:rgba(23,38,31,.97);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 28px rgba(0,0,0,.35);border-radius:18px;padding:14px}.notice.show{display:block}.notice h2{font-size:15px;margin:0 0 6px}.notice p{font-size:13px;color:var(--muted);line-height:1.35;margin:0 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}.primary{background:var(--accent);color:#0c1b12}.secondary{background:#293c32}.close{background:transparent;border:1px solid #40574b;color:var(--muted)}
    .legend{position:absolute;z-index:800;right:12px;top:72px;background:rgba(23,38,31,.92);border-radius:14px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.22)}.legend-row{display:flex;align-items:center;gap:7px;margin:4px 0}.dot{width:10px;height:10px;border-radius:50%}.dot.parking{background:#6ab7ff}.dot.you{background:#80cfa0}
    @media (max-width:520px){header{padding-top:max(10px,env(safe-area-inset-top))}.brand p{max-width:150px}.locate span.label{display:none}.locate{padding:10px 11px}.legend{top:70px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Bleau Map</h1><p>Fontainebleau · mobile Karte</p></div>
    <button class="locate" id="locateBtn" type="button" aria-label="Meinen Standort anzeigen">◎ <span class="label">Mein Standort</span></button>
  </header>
  <div id="map"></div>
</div>
<div class="legend"><div class="legend-row"><span class="dot parking"></span>Parkplatz</div><div class="legend-row"><span class="dot you"></span>Dein Standort</div></div>
<div class="floating"><div class="notice" id="notice"><h2 id="noticeTitle">Standortzugriff</h2><p id="noticeText"></p><div class="actions" id="noticeActions"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  const map=L.map('map',{zoomControl:true}).setView([48.404,2.685],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

  const parkings=[];
  const parkingIcon=L.divIcon({className:'',html:'<div style="width:28px;height:28px;border-radius:50%;background:#2787d8;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;color:white;font:bold 16px system-ui">P</div>',iconSize:[28,28],iconAnchor:[14,14]});
  parkings.forEach(p=>{
    const marker=L.marker([p.lat,p.lng],{icon:parkingIcon}).addTo(map);
    const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat+','+p.lng)}`;
    marker.bindPopup(`<div class="popup-title">${p.name}</div><div class="popup-sub">Parkplatz</div><a class="maps-link" href="${url}" target="_blank" rel="noopener">In Google Maps öffnen</a>`);
  });

  let userMarker=null,userCircle=null;
  const notice=document.getElementById('notice'),noticeTitle=document.getElementById('noticeTitle'),noticeText=document.getElementById('noticeText'),noticeActions=document.getElementById('noticeActions');
  function hideNotice(){notice.classList.remove('show')}
  function showNotice(title,text,buttons=[]){noticeTitle.textContent=title;noticeText.innerHTML=text;noticeActions.innerHTML='';buttons.forEach(b=>{const el=document.createElement('button');el.textContent=b.text;el.className=b.cls||'secondary';el.onclick=b.onClick;noticeActions.appendChild(el)});notice.classList.add('show')}
  function drawLocation(pos){const {latitude,longitude,accuracy}=pos.coords;if(userMarker)map.removeLayer(userMarker);if(userCircle)map.removeLayer(userCircle);userCircle=L.circle([latitude,longitude],{radius:accuracy,color:'#80cfa0',fillColor:'#80cfa0',fillOpacity:.12,weight:1}).addTo(map);userMarker=L.circleMarker([latitude,longitude],{radius:9,color:'#fff',weight:3,fillColor:'#44c779',fillOpacity:1}).addTo(map).bindPopup('<div class="popup-title">Du bist hier</div>');map.setView([latitude,longitude],15);hideNotice()}
  function locationError(err){let text='Der Standort konnte nicht bestimmt werden.';if(err.code===1){text='<b>Standort ist für diese Seite blockiert.</b><br>Tippe in Chrome auf das Symbol links neben der Webadresse → <b>Berechtigungen</b> → <b>Standort</b> → <b>Zulassen</b>. Danach hier erneut versuchen.'}else if(err.code===2){text='Dein Gerät konnte gerade keinen Standort ermitteln. Prüfe, ob GPS/Standort am Handy eingeschaltet ist.'}else if(err.code===3){text='Die Standortbestimmung hat zu lange gedauert. Versuche es erneut.'}showNotice('Standort nicht verfügbar',text,[{text:'Erneut versuchen',cls:'primary',onClick:requestLocation},{text:'Schliessen',cls:'close',onClick:hideNotice}])}
  function requestLocation(){if(!('geolocation' in navigator)){showNotice('Nicht unterstützt','Dieser Browser unterstützt die Standortbestimmung nicht.',[{text:'Schliessen',cls:'close',onClick:hideNotice}]);return}navigator.geolocation.getCurrentPosition(drawLocation,locationError,{enableHighAccuracy:true,timeout:12000,maximumAge:10000})}
  document.getElementById('locateBtn').addEventListener('click',requestLocation);

  if(navigator.permissions?.query){navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='denied'){showNotice('Standort ist blockiert','Für den Live-Standort musst du die Berechtigung dieser Seite in deinem Browser auf <b>Zulassen</b> setzen.',[{text:'So geht’s',cls:'primary',onClick:()=>showNotice('Standort freigeben','In Chrome: Symbol links neben der Adresse → <b>Berechtigungen</b> → <b>Standort</b> → <b>Zulassen</b>. Danach zurück zur Karte und auf <b>Mein Standort</b> tippen.',[{text:'Standort erneut prüfen',cls:'primary',onClick:requestLocation},{text:'Schliessen',cls:'close',onClick:hideNotice}])},{text:'Schliessen',cls:'close',onClick:hideNotice}])}}).catch(()=>{})}
</script>
</body>
</html>
